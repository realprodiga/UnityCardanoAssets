<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minting Tokens (preprod)</title>
    
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <div id="header-bar">
        <span>Minting Tokens (preprod)</span>
        <button id="connect-btn" onclick="toggleWallet()">Connect Wallet</button>
    </div>

    <div id="canvas-container">
      <canvas id="unity-canvas"></canvas>
    </div>

    <!-- Mesh SDK bundle: local copy if present (GitHub release), otherwise the pinned, integrity-checked copy on jsDelivr
         (the Asset Store package ships without it -- see Third-Party Notices.txt). -->
    <script src="cardano-mint-sdk.bundle.js"></script>
    <script>window.CardanoMintSDK || document.write('<script src="https://cdn.jsdelivr.net/gh/realprodiga/UnityCardanoAssets@v1.0.0/CardanoSDK/Assets/CardanoSDK/WebGLTemplates/CardanoBasic/cardano-mint-sdk.bundle.js" integrity="sha384-PExqHCvhUNBdg5kkLp3IZS1ueB4GgtwVyxhdDD2WhOqXKqlIEeX8n16HFYeWJSkc" crossorigin="anonymous"><\/script>');</script>
    <script src="script.js"></script>

    <script>
      var container = document.querySelector("#canvas-container");
      var canvas = document.querySelector("#unity-canvas");
      var myGameInstance = null;

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/MintingTokens.loader.js";
      var config = {
        dataUrl: buildUrl + "/MintingTokens.data",
        frameworkUrl: buildUrl + "/MintingTokens.framework.js",
        codeUrl: buildUrl + "/MintingTokens.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "prodiga",
        productName: "Minting Tokens (preprod)",
        productVersion: "0.1",
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // Loading bar logic could go here
        }).then((unityInstance) => {
          myGameInstance = unityInstance;
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
